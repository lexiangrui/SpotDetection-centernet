[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "centernet-spot"
version = "0.1.0"
description = "CenterNet-based spot detection for light spot localization"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
rknn = ["rknn-toolkit2"]

[tool.setuptools.packages.find]
where = ["src"]
