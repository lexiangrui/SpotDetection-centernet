experiment_name: spot_centernet_unet
seed: 42

model:
  backbone: unet
  backbone_kwargs:
    base_channels: 32
  neck_channels: 128
  head_channels: 64

data:
  root: .
  image_dir: photos
  label_dir: labels_raw
  split_dir: splits
  train_split: train.txt
  val_split: val.txt
  val_ratio: 0.25
  class_name: spot
  spot_size_label: spot_size
  spot_size_shape_type: line
  input_width: 640
  input_height: 384
  down_ratio: 4
  max_objects: 512
  point_box_width: 36
  point_box_height: 36
  gaussian_min_overlap: 0.7
  min_gaussian_radius: 5
  normalize_mean: [0.5, 0.5, 0.5]
  normalize_std: [0.5, 0.5, 0.5]
  train_augment:
    brightness_gain: 0.15
    noise_std: 0.01

train:
  batch_size: 4
  num_workers: 0
  epochs: 120
  lr: 0.001
  weight_decay: 0.0001
  log_interval: 5
  save_dir: outputs/spot_centernet_unet
  heatmap_loss_weight: 1.0
  offset_loss_weight: 1.0

infer:
  score_threshold: 0.3
  topk: 256
  nms_kernel: 9
