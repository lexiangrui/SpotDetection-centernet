experiment_name: spot_centernet
seed: 42

data:
  root: .
  image_dir: photos
  label_dir: labels_raw
  split_dir: splits
  train_split: train.txt
  val_split: val.txt
  val_ratio: 0.25
  class_name: spot
  spot_size_label: spot_size
  spot_size_shape_type: line
  input_width: 640
  input_height: 480
  down_ratio: 4
  max_objects: 512
  train_augment:
    brightness_gain: 0.1
    noise_std: 0.01

train:
  batch_size: 4
  num_workers: 0
  epochs: 60
  lr: 0.0005
  weight_decay: 0.0001
  log_interval: 5
  vis_interval: 5
  save_dir: models/spot_centernet_resnet18_focal
  heatmap_loss_type: focal
  heatmap_loss_weight: 1.0
  offset_loss_weight: 1.0
  selection_min_delta: 0.0001
  selection_ap_weight: 0.7
  selection_f1_weight: 0.3
  early_stop_patience: 12
  scheduler_patience: 4
  scheduler_factor: 0.5

eval:
  score_thresholds: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9]
  topk: 256
  nms_kernel: 9
  match_radius_scale: 0.3
  min_match_radius: 3.0

infer:
  score_threshold: 0.3
  topk: 256
  nms_kernel: 5
